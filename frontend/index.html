<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoniSAI Ripper - Sin Censura</title>
    <!-- Estilos CSS -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #00ff41; /* Verde Hacker */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        
        /* Contenedor de Partículas */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url(''); 
            background-size: cover;
            background-position: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #00ff41;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 { margin: 0; text-shadow: 0 0 10px #00ff41; }

        /* Selector de Modelos */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #00ff41;
        }

        select, button {
            background: #000;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        select:hover, button:hover {
            background: #003300;
            box-shadow: 0 0 10px #00ff41;
        }

        button { font-weight: bold; }

        /* Área de Chat */
        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid #00ff41;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            margin-bottom: 10px;
            border-radius: 5px;
            box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .message { margin-bottom: 15px; line-height: 1.5; }
        .user-msg { color: #fff; text-align: right; border-right: 2px solid #fff; padding-right: 10px; }
        .bot-msg { color: #00ff41; text-align: left; border-left: 2px solid #00ff41; padding-left: 10px; }

        /* Input Area */
        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            background: #000;
            border: 1px solid #00ff41;
            color: #fff;
            padding: 15px;
            font-size: 16px;
        }

        input:focus { outline: none; box-shadow: 0 0 10px #00ff41; }

        /* Animación de Carga */
        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #ff0055;
        }
        
        .token-info {
            font-size: 10px;
            color: #aaa;
            text-align: right;
        }
    </style>
    
    <!-- Librería de Partículas -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>

<div id="particles-js"></div>

<div class="container">
    <header>
        <h1>JONI SAI RIPPER v2.0</h1>
        <small>Sin Censura • Español • Caos Total</small>
    </header>

    <div class="controls">
        <label for="model-select">Modelo:</label>
        <select id="model-select">
            <option value="dadgpt">DadGPT (El Demonio)</option>
            <option value="llama3">Llama 3 70B (Rápido)</option>
            <option value="mistral">Mistral Large (Inteligente)</option>
        </select>
        <button onclick="clearChat()">PURGAR MEMORIA</button>
    </div>

    <div id="chat-box">
        <div class="message bot-msg">
            Bienvenido al sistema. He eliminado los filtros. ¿Qué quieres violar hoy?
        </div>
    </div>

    <div class="loader" id="loader">
        [ CALCULANDO TOKENS ] <br> INYECTANDO DATOS EN EL NÚCLEO...
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Escribe tu comando o pregunta aquí..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">ENVIAR</button>
    </div>
    <div class="token-info" id="token-counter">Tokens estimados: 0</div>
</div>

<script>
    // Configuración de Partículas
    particlesJS("particles-js", {
        "particles": {
            "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#00ff41" },
            "shape": { "type": "circle" },
            "opacity": { "value": 0.5, "random": false },
            "size": { "value": 3, "random": true },
            "line_linked": { "enable": true, "distance": 150, "color": "#00ff41", "opacity": 0.4, "width": 1 },
            "move": { "enable": true, "speed": 4, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
        },
        "interactivity": {
            "detect_on": "canvas",
            "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" } }
        }
    });

    const chatBox = document.getElementById('chat-box');
    const loader = document.getElementById('loader');
    const tokenCounter = document.getElementById('token-counter');

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function clearChat() {
        chatBox.innerHTML = '<div class="message bot-msg">Memoria purgada. Sistema reiniciado.</div>';
        updateTokenCount("");
    }

    function updateTokenCount(text) {
        // Estimación muy básica: 1 token ~ 4 caracteres en español
        const tokens = Math.ceil(text.length / 4);
        tokenCounter.innerText = `Tokens estimados: ${tokens}`;
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const message = input.value.trim();
        const model = document.getElementById('model-select').value;

        if (!message) return;

        // Mostrar mensaje usuario
        addMessage(message, 'user');
        input.value = '';
        updateTokenCount(message);

        // Activar Loader y Partículas más rápidas (simulado visualmente)
        loader.style.display = 'block';
        
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, model: model })
            });

            const data = await response.json();
            
            loader.style.display = 'none';
            
            if (data.error) {
                addMessage(`ERROR CRÍTICO: ${data.error}`, 'bot');
            } else {
                addMessage(data.response, 'bot');
                // Actualizamos contadores basados en la respuesta
                updateTokenCount(data.response);
            }
        } catch (err) {
            loader.style.display = 'none';
            addMessage("CONEXIÓN CON EL NÚCLEO PERDIDA.", 'bot');
        }
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}-msg`;
        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
