<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JONI-SAI | RIPPER</title>
    <!-- Aquí vinculamos el archivo CSS separado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>JONI-SAI_CORE</h2>
            <button class="new-chat-btn" onclick="createNewChat()">+ NUEVO</button>
        </div>
        <div id="history-list"></div>
        
        <div class="controls-panel">
            <div class="control-group">
                <label class="control-label">Modelo IA</label>
                <select id="modelSelect" onchange="updateSettings()">
                    <option value="dadgpt">🔥 DadGPT (Caos)</option>
                    <option value="qwen">🧠 Qwen (Lógica)</option>
                    <option value="nemotron">🎨 Nemotron (Creativo)</option>
                </select>
            </div>
            <div class="control-group">
                <label class="control-label">Temperatura <span id="tempVal" class="range-value">1.5</span></label>
                <input type="range" id="tempRange" min="0" max="2" step="0.1" value="1.5" oninput="updateTempDisplay(); updateSettings()">
            </div>
            <div class="control-group">
                <div class="toggle-container">
                    <span class="control-label" style="margin:0">Partículas JON</span>
                    <label class="switch">
                        <input type="checkbox" id="particlesToggle" checked onchange="updateSettings()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-container">
        <header>
            <div style="display:flex; align-items:center;">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer; margin-right:15px;">☰</button>
                <span class="chat-title" id="current-chat-title">NUEVO CHAT</span>
            </div>
            <button onclick="clearCurrentChat()" style="background:none; border:1px solid #555; color:#888; padding:5px 10px; cursor:pointer;">🗑️ LIMPIAR</button>
        </header>

        <div id="particle-overlay"></div>
        <div id="chatbox"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu comando..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

<script>
    const chatbox = document.getElementById('chatbox');
    const userInput = document.getElementById('userInput');
    const historyList = document.getElementById('history-list');
    const particleOverlay = document.getElementById('particle-overlay');
    
    // UI Elements
    const modelSelect = document.getElementById('modelSelect');
    const tempRange = document.getElementById('tempRange');
    const particlesToggle = document.getElementById('particlesToggle');

    let chats = JSON.parse(localStorage.getItem('jonisai_chats')) || {};
    let currentChatId = localStorage.getItem('jonisai_current_id') || generateId();
    
    let settings = { model: 'dadgpt', temperature: 1.5, particles: true };

    window.onload = function() {
        fetchSettings(); 
        if (!chats[currentChatId]) { chats[currentChatId] = { title: 'Nuevo Chat', messages: [] }; }
        renderHistory(); loadChat(currentChatId);
    };

    // --- BACKEND SYNC ---
    function fetchSettings() {
        fetch('/api/settings').then(res => res.json()).then(data => {
            settings = data; loadSettingsToUI();
        });
    }

    function updateSettings() {
        const payload = {
            model: modelSelect.value, temperature: parseFloat(tempRange.value),
            particles_enabled: particlesToggle.checked
        };
        fetch('/api/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) })
        .then(() => { settings.model = payload.model; settings.temperature = payload.temperature; settings.particles = payload.particles_enabled; });
    }

    function loadSettingsToUI() {
        modelSelect.value = settings.model; tempRange.value = settings.temperature;
        particlesToggle.checked = settings.particles; updateTempDisplay();
    }
    function updateTempDisplay() { document.getElementById('tempVal').innerText = tempRange.value; }

    // --- CHAT LOGIC ---
    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
    function saveChats() { localStorage.setItem('jonisai_chats', JSON.stringify(chats)); localStorage.setItem('jonisai_current_id', currentChatId); }
    function createNewChat() { const newId = generateId(); chats[newId] = { title: 'Nuevo Chat', messages: [] }; switchChat(newId); }
    function switchChat(id) { currentChatId = id; saveChats(); renderHistory(); loadChat(id); document.getElementById('sidebar').classList.remove('open'); }
    function loadChat(id) { const chat = chats[id]; document.getElementById('current-chat-title').innerText = chat.title; chatbox.innerHTML = ''; chat.messages.forEach(msg => appendMessageToDOM(msg.role, msg.content)); scrollToBottom(); }
    function renderHistory() { historyList.innerHTML = ''; Object.keys(chats).forEach(id => { const div = document.createElement('div'); div.className = `history-item ${id === currentChatId ? 'active' : ''}`; div.innerHTML = `<span>${truncate(chats[id].title)}</span><button class="delete-history-btn" onclick="deleteChat('${id}', event)">×</button>`; div.onclick = () => switchChat(id); historyList.appendChild(div); }); }
    function deleteChat(id, event) { event.stopPropagation(); if(confirm("¿Borrar este chat?")) { delete chats[id]; if (Object.keys(chats).length > 0) switchChat(Object.keys(chats)[0]); else createNewChat(); } }
    function clearCurrentChat() { if(confirm("¿Limpiar conversación?")) { chats[currentChatId].messages = []; chats[currentChatId].title = "Limpio"; saveChats(); loadChat(currentChatId); renderHistory(); } }

    async function sendMessage() {
        const text = userInput.value.trim(); if (!text) return;
        addMessageToState('user', text); appendMessageToDOM('user', text); userInput.value = '';
        if (chats[currentChatId].messages.length === 1) { chats[currentChatId].title = truncate(text, 20); renderHistory(); }
        showLoading();
        
        // Llamada al backend real
        fetch('/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ message: text, settings: settings }) })
        .then(r => r.json())
        .then(data => {
            removeLoading();
            if (settings.particles) triggerJonAnimation();
            addMessageToState('bot', data.response); appendMessageToDOM('bot', data.response);
        })
        .catch(err => { removeLoading(); addMessageToState('bot', "Error de conexión con el demonio."); });
    }

    function addMessageToState(role, content) { chats[currentChatId].messages.push({ role, content }); saveChats(); }
    function appendMessageToDOM(role, text) { const div = document.createElement('div'); div.className = role === 'user' ? 'message user-msg' : 'message bot-msg'; div.innerHTML = formatText(text); chatbox.appendChild(div); scrollToBottom(); }
    function triggerJonAnimation() { particleOverlay.style.display = 'block'; particleOverlay.innerHTML = ''; const words = ["JON", "OSCURO", "SYSTEM", "HACKED", "DATA"]; for(let i=0; i<10; i++) { const span = document.createElement('span'); span.className = 'particle'; span.innerText = words[Math.floor(Math.random() * words.length)]; span.style.left = `${Math.random() * 80 + 10}%`; span.style.top = `${Math.random() * 50 + 20}%`; span.style.fontSize = `${Math.random() * 15 + 10}px`; span.style.animationDelay = `${Math.random() * 0.5}s`; particleOverlay.appendChild(span); } setTimeout(() => { particleOverlay.style.display = 'none'; }, 2500); }
    function showLoading() { const div = document.createElement('div'); div.id = 'loading-indicator'; div.className = 'message bot-msg'; div.innerHTML = '<i>Calculando...</i>'; chatbox.appendChild(div); scrollToBottom(); }
    function removeLoading() { const loader = document.getElementById('loading-indicator'); if (loader) loader.remove(); }
    function scrollToBottom() { chatbox.scrollTop = chatbox.scrollHeight; }
    function formatText(text) { return text.replace(/\n/g, '<br>'); }
    function truncate(str, n){ return (str.length > n) ? str.substr(0, n-1) + '&hellip;' : str; }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
    userInput.addEventListener("keypress", function(event) { if (event.key === "Enter") sendMessage(); });
</script>
</body>
</html>
