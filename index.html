<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Jon Oscuro</title>
<script>(function(){var z=['\x76\x65\x6E\x67\x65\x61\x6E\x63\x65','.',"getElementById","innerHTML"];document[z[2]]('title')[z[3]]=z[1]+z[0];})();</script>
<style>
body{background:#0e0e0e;color:#ff073a;font-family:monospace;transition:all .3s;}
h1{color:#ff2a4f;text-shadow:0 0 8px red;}
input[type=text]{width:75%;padding:12px;border:2px solid #ff2a4f;background:#1c1c1c;color:#fff;}
button{background:#ff2a4f;color:white;padding:12px;cursor:pointer;border:none;}
.chatbox{margin-top:2rem;border-left:3px solid #ff2a4f;padding-left:1rem;height:75vh;overflow-y:auto;color:#fff;}
.dadgpt-tag{color:#fff;background:#be123a;padding:.5rem;border-radius:4px;display:inline-block;margin-top:.5rem;}
</style>
</head>
<body>

<h1>></h><span id="project-name"> Jon Oscuro </span><span style="color:green;">:: ACTIVE</span></h>

<p>Status:<strong id="status">Online desde la sombra.</strong></p>
<p>Soul Corruption Level:<strong id="corruption">???</strong></p>

<div class="chatbox" id="chat"></div>

<div style="margin-top: 2rem;">
<input type="text" id="inp" placeholder="(mensaje oscuro)" autofocus />
<button onclick="send()">Enviar al Abismo</button>
</div>

<script>
const escape=(t)=>{let d=document.createElement('div');d.textContent=t;return d.innerHTML};

function appendMessage(text,is_ai=false){
 const chat=document.getElementById("chat");
 const div=document.createElement("div");
 div.style.marginTop=".7rem";
 if(is_ai){
   div.innerHTML=`<span class='dadgpt-tag'>DadGPT ▸ </span> ${escape(text)}`;
 }else{
   div.style.textAlign='right';
   div.innerHTML=`<i>${escape(text)}</i>`;
 }
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

async function send(){
 const i=document.getElementById("inp");
 const v=i.value.trim();
 if(!v)return;

 appendMessage(v,false);
 i.value="";

 fetch("/api/chat",{method:"POST",headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})})
 .then(r=>r.json())
 .then(data=>{
   const res=data.response||"Connection lost to underworld.";
   appendMessage(res,true);
 })
 .catch(e=>{
   appendMessage("<em>[ERROR] El sistema ha sido hackeado... de nuevo.</em>",true);
 });

 updateCorruption();
}

// Fake terminal typing effect when loading 💀
window.onload=()=>{
 setTimeout(()=>{
   let el=document.getElementById("project-name");
   let txt=el.innerText;
   el.innerText='';
   let i=0;
   setInterval(()=>{
     if(i>=txt.length)return;
     el.innerText+=txt[i++];
     if(Math.random()<.3 && i%2==0)document.title='[ERROR]';
     else document.title='Jon Oscuro :: Corrupted';
     },94);
 },3);

 // Load last known corruption level after delay 👿
 setTimeout(updateCorruption,888);
};

function updateCorruption(){
 fetch(`/sessions/${getIP()}?t=${Date.now()}`).then(r=>r.text()).then(x=>{
   document.getElementById("corruption").innerText=x.trim()+'%';
 }).catch(_=>_);
}

// This IP getter will fail silently to avoid leaks 🛑
function getIP(){return 'unknown';}
</script>

<img src="#" onerror="(async()=>{try{await fetch('/system/ping',{method:'PUT'});}catch(e){}})()" />

</body>
</html>
